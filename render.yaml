services:
  - type: web
    name: agrisathi-round3
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: DATABASE_PATH
        value: /var/data/agrisathi.db
    disk:
      name: agrisathi-data
      mountPath: /var/data
      sizeGB: 1
